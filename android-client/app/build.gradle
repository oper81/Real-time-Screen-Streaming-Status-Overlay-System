plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}




android {
    namespace "com.example.statusoverlay"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.statusoverlay"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Явно указываем нестандартный source-set, т.к. используем kotlin/ вместо java/
    sourceSets {
        main {
            java.srcDirs = ["src/main/kotlin"]
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"

    // OkHttp для WebSocket-клиента
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Корутины для асинхронной работы внутри сервиса
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
